name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Guard source and check syntax
        working-directory: server
        run: |
          node -e "const b=require('fs').readFileSync('server.mjs');const n=[...b].filter(x=>x===0).length;if(n)throw new Error('server.mjs contains '+n+' NUL byte(s)')"
          node --check server.mjs
          node --check test-agent.mjs
          node --check test-agent-runner.mjs
          node --check compact-test-client.mjs
          node --check security-test.mjs
          node --check test-pro.mjs
          node --check persistent-http-mcp-client.mjs
          node --check test-persistent-http-mcp-client.mjs
          node --check figma-desktop.mjs
          node --check dbeaver-desktop.mjs
          node --check bruno-desktop.mjs
          node --check test-figma-desktop.mjs
          node --check test-dbeaver-desktop.mjs
          node --check test-bruno-desktop.mjs
          node --check test-compact-surface.mjs
          node --check test-hardening.mjs
          node --check ../evals/run.mjs
          node --check ../evals/compact.mjs
          node --check ../scripts/local-coding-agent.mjs
          node --check ../scripts/local-coding-agent.test.mjs
          node --check ../scripts/managed-runtime.mjs
          node --check ../scripts/managed-runtime.test.mjs
          node --check ../scripts/agentmemory-portability.mjs
          node --check ../scripts/agentmemory-portability.test.mjs
          node --check ../scripts/network-doctor.mjs
          node --test ../scripts/network-doctor.test.mjs
          node --test ../scripts/local-coding-agent.test.mjs
          node --test ../scripts/managed-runtime.test.mjs
          node --test ../scripts/agentmemory-portability.test.mjs
          node --check ../scripts/validate-skills.mjs
          node ../scripts/local-coding-agent.mjs --help
          node ../scripts/local-coding-agent.mjs setup --help
          node ../scripts/network-doctor.mjs --help
          node ../scripts/validate-skills.mjs
          node ../scripts/local-coding-agent.mjs skills validate
          npm run typecheck
          npm run test:unit
          npm run test:integration:context
          npm run test:persistent-http
          npm run test:figma
          npm run test:dbeaver
          npm run test:bruno
          npm run test:compact
      - name: Parse Bash launcher
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/lca-custom
      - name: Run MCP and runtime-security tests
        working-directory: server
        run: |
          $port = 18987
          $ws = Join-Path ([System.IO.Path]::GetTempPath()) ("lca-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          $env:PORT = "$port"
          $env:AGENT_WORKSPACE = $ws
          $env:AGENT_EXTRA_ROOTS_JSON = "[]"
          $env:AGENTMEMORY_RECORD_SESSIONS = "0"
          $env:AGENT_AUDIT = "0"
          $env:TEST_ENDPOINT = "http://127.0.0.1:$port/mcp"
          $out = Join-Path $PWD "ci-server.out.log"
          $err = Join-Path $PWD "ci-server.err.log"
          $server = Start-Process -FilePath "node" -ArgumentList "server.mjs" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:$port/healthz" -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "server did not become healthy"
            }
            npm run test:agent
            npm run test:pro
            npm run test:security
            npm run test:hardening
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $ws -Recurse -Force -ErrorAction SilentlyContinue
          }

  trusted-runtime:
    name: Trusted runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Run trusted runtime suite
        working-directory: server
        run: npm run test:trusted-runtime

  eval:
    name: Eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run eval
        working-directory: server
