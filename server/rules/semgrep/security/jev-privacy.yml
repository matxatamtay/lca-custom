rules:
  - id: lca.security.no-raw-evidence-to-jev-payload
    message: Raw workspace evidence must not be sent to Jev; use the filtered remote-safe candidate set.
    severity: ERROR
    languages: [typescript]
    pattern: buildRequestPayload($REQUEST, evidence, ...)
    paths:
      include:
        - src/adapters/jev/jev-context-reranker.ts
    metadata:
      lca_category: SECURITY
      component: jev-privacy

  - id: lca.security.no-json-stringify-raw-evidence-for-jev
    message: Raw evidence must not be serialized directly in the Jev adapter.
    severity: ERROR
    languages: [typescript]
    pattern: JSON.stringify(evidence)
    paths:
      include:
        - src/adapters/jev/jev-context-reranker.ts
    metadata:
      lca_category: SECURITY
      component: jev-privacy
